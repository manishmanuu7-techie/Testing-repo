name: Deploy Flask App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/age-calculator
            git fetch origin main
            git reset --hard origin/main
            
            # Recreate venv if missing
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            source venv/bin/activate
            pip install -r Calculate_age/requirements.txt
            
            # Stop existing instance safely
            pkill -f "python Calculate_age/app.py" || true
            
            # Start process detached from SSH session
            (nohup python Calculate_age/app.py > app.log 2>&1 &)
            sleep 3
